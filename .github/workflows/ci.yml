name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: CPU tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,evaluation,models]" "mlflow>=3.0,<4"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run tests
        run: python -m pytest --junitxml=test-results/junit.xml
      - name: Summarize test results
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("test-results/junit.xml")
          if not report.exists():
              summary = "Pytest did not produce a JUnit report."
          else:
              root = ET.parse(report).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
              tests = sum(int(suite.attrib.get("tests", 0)) for suite in suites)
              failures = sum(int(suite.attrib.get("failures", 0)) for suite in suites)
              errors = sum(int(suite.attrib.get("errors", 0)) for suite in suites)
              skipped = sum(int(suite.attrib.get("skipped", 0)) for suite in suites)
              summary = (
                  f"Pytest: {tests - failures - errors - skipped} passed, "
                  f"{failures} failed, {errors} errors, {skipped} skipped."
              )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(f"## Test results\n\n{summary}\n")
          print(summary)
          PY
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report
          path: test-results/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install ruff
      - run: ruff check src/ scripts/ tests/
      - run: ruff format --check src/ scripts/ tests/

  types:
    name: Mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install mypy
      - run: mypy src scripts

  dependency-check:
    name: Dependency consistency
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch and project test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,evaluation,models]" "mlflow>=3.0,<4"
      - run: python -m pip check

  notebook-quality:
    name: Notebook lint (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install ruff
      - name: Report notebook Ruff findings without rewriting notebooks
        run: ruff check notebooks/
